# capability-path-proof.yml
#
# Real-run proofs for CAP-MANIFEST-PATH. The action is consumed by LOCAL PATH
# (`uses: ./`) from this repository's own checkout, which is the same mechanical
# shape the load-check gate uses; each job points capability_path at a real fixture
# manifest that EXISTS in the consumer checkout, so a green `Validate capability
# manifest` name/label in the log is proof the path resolved AND the real manifest
# was read.
#
# These jobs never publish: api_token is empty and registry_url is unreachable, so
# the guarded publish step fails closed (exit non-zero) before contacting a registry
# — the same configuration and reasoning as action-load-check.yml. A job therefore
# never reaches a fully-green tick; the criterion asserted here is that the action
# GETS PAST `Validate capability manifest`.
#
# The manifest lives under tests/fixtures, NOT at the repo root, so this workflow
# does not (and must not) turn the missing-root-`capability.yaml` load-check green:
# that repo-level gap is a separate defect and is deliberately left alone here.

name: Capability Path Proof

on:
  push:
    branches:
      - 'fix/CAP-manifest-path'
  workflow_dispatch:

jobs:
  relative-file-present:
    name: Validate passes (relative file in consumer checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consume action, relative file path
        uses: ./
        with:
          api_token: ""
          use_oidc: "false"
          registry_url: "https://127.0.0.1:9/do-not-contact"
          capability_path: "./tests/fixtures/capability-manifest/capability.yaml"

  directory-arg:
    name: Validate passes (directory arg => capability.yaml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consume action, directory path
        uses: ./
        with:
          api_token: ""
          use_oidc: "false"
          registry_url: "https://127.0.0.1:9/do-not-contact"
          capability_path: "./tests/fixtures/capability-manifest"

  absolute-path:
    name: Validate passes (absolute path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consume action, absolute path
        uses: ./
        with:
          api_token: ""
          use_oidc: "false"
          registry_url: "https://127.0.0.1:9/do-not-contact"
          capability_path: "${{ github.workspace }}/tests/fixtures/capability-manifest/capability.yaml"

  red-missing-default:
    name: RED - default root manifest genuinely absent still fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no root capability.yaml present
        run: |
          if [ -e ./capability.yaml ]; then
            echo "::error::unexpected: ./capability.yaml exists; red proof invalid"
            exit 1
          fi
          echo "confirmed: no ./capability.yaml in this checkout"
      - name: Consume action with default capability_path (must fail clearly)
        uses: ./
        with:
          api_token: ""
          use_oidc: "false"
          registry_url: "https://127.0.0.1:9/do-not-contact"
